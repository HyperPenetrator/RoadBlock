services:
  - type: web
    name: roadfirewall-backend
    env: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: free
    healthCheckPath: /docs
    envVars:
      - key: PORT
        value: 7860
      - key: WEATHER_API_KEY
        sync: false

  - type: web
    name: roadfirewall-frontend
    env: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: roadfirewall-backend
          type: web
          property: host
